<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#971234">
  <meta name="description" content="LVFC Player Development, powered by KIXEL">
  <link rel="manifest" href="./manifest.webmanifest?v=mobile-recovery-4">
  <link rel="stylesheet" href="./firebase-styles-v1.css?v=mobile-recovery-4">
  <link rel="stylesheet" href="./kixel-brand.css?v=mobile-recovery-4">
  <title>LVFC Player Development — Powered by KIXEL</title>
  <style>
    .corner-brand{position:fixed;z-index:1000;display:block;object-fit:contain;pointer-events:none}
    .corner-brand.lvfc{top:calc(10px + env(safe-area-inset-top));left:10px;width:min(138px,36vw);max-height:52px}
    .corner-brand.kixel{right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:min(128px,34vw);max-height:50px;border-radius:8px}
    .brandLockup{visibility:hidden!important;width:0!important;height:0!important;overflow:hidden!important}
    .top,.shellHead{padding-left:min(150px,39vw)!important;min-height:58px}
    .screen{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}
    @media (min-width:700px){
      .corner-brand.lvfc{top:16px;left:16px;width:160px;max-height:60px}
      .corner-brand.kixel{right:16px;bottom:16px;width:150px;max-height:58px}
      .top,.shellHead{padding-left:176px!important}
    }
  </style>
</head>
<body>
  <img class="corner-brand lvfc" src="./lvfc-logo.png?v=mobile-recovery-4" alt="Lahore Virgil Football Club">
  <img class="corner-brand kixel" src="./kixel-logo.png?v=mobile-recovery-4" alt="KIXEL">
  <div id="app"><main class="screen loading">Loading LVFC Player Development…</main></div>
  <script type="module" src="./kixel-app-v4.js?v=mobile-recovery-4"></script>
</body>
</html>
