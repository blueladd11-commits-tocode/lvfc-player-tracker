<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8f1032"><link rel="manifest" href="manifest.webmanifest"><title>LVFC Player Tracker</title><style>:root{--r:#9d1237;--d:#51091d;--p:#f7f3ef;--i:#211b1d;--m:#756c6f;--l:#e3d8d5;--s:#f8e7ed}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--p);color:var(--i)}button,input{font:inherit}button{border:0}.screen{min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.dark{background:linear-gradient(155deg,#18060c,#671027 58%,#a8143e);color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:8px}.brand b{font-family:Georgia,serif;font-size:30px;letter-spacing:-2px}.brand small{font-size:8px;font-weight:800;line-height:1.1}.pill{padding:9px 12px;border-radius:999px;background:#ffffff1c;font-size:12px;font-weight:800}.ey{margin:0 0 8px;color:var(--r);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.dark .ey{color:#f3c5d2}h1{font-size:clamp(36px,10vw,54px);line-height:.98;letter-spacing:-.055em;margin:0 0 14px}h2{font-size:28px;letter-spacing:-.04em;margin:0 0 10px}.lead{font-size:17px;line-height:1.5;color:#f0dce2}.roles,.players,.checks{display:grid;gap:10px}.roles{margin-top:28px}.role{width:100%;padding:18px;border-radius:22px;background:#fff;color:var(--i);display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:12px;text-align:left}.role.red{background:#cb2855;color:#fff}.emoji{width:52px;height:52px;border-radius:17px;background:var(--s);display:grid;place-items:center;font-size:25px}.role.red .emoji{background:#ffffff22}.role strong{display:block;font-size:17px}.role small{display:block;margin-top:4px;color:var(--m)}.role.red small{color:#f9dde6}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:17px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:850}.field input{width:100%;border:1.5px solid var(--l);border-radius:15px;padding:15px;background:#fff}.primary,.secondary,.danger{width:100%;min-height:54px;border-radius:16px;padding:14px 17px;font-weight:900}.primary{background:var(--r);color:#fff}.secondary{background:#fff;border:1px solid var(--l)}.danger{background:#fff0f3;color:var(--r);border:1px solid #efc5d0}.back{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-weight:900}.demo{margin-top:14px;padding:13px 14px;border-radius:16px;background:var(--s);color:var(--d);font-size:13px;line-height:1.55}.wait{min-height:65dvh;display:grid;place-items:center;text-align:center}.counter{background:radial-gradient(circle at 50% 0,#be315d,#8c1033 48%,#450717);color:#fff;display:flex;flex-direction:column}.counter h1{font-size:35px;text-align:center}.counterBody{flex:1;display:grid;place-items:center;min-height:390px}.touch{width:min(78vw,330px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#f0e1e6);color:var(--r);box-shadow:0 30px 70px #1b000860;display:flex;flex-direction:column;align-items:center;justify-content:center}.touch:active{transform:scale(.97)}.num{font-size:clamp(88px,25vw,126px);font-weight:950;line-height:.84;letter-spacing:-.08em}.tap{margin-top:18px;font-size:15px;font-weight:950;letter-spacing:.18em}.coach{min-height:100dvh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}.coachHead{position:sticky;top:0;z-index:10;padding:calc(13px + env(safe-area-inset-top)) 15px 13px;background:#f7f3eff3;backdrop-filter:blur(16px);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between}.coachContent{padding:17px 15px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid var(--l);z-index:20}.nav button{background:transparent;color:#7d7477;padding:8px;font-size:11px;font-weight:850}.nav .active{background:var(--s);color:var(--r);border-radius:12px}.banner{background:linear-gradient(140deg,var(--d),var(--r));color:#fff;border-radius:24px;padding:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#fff;border:1px solid var(--l);border-radius:18px;padding:13px 9px}.metric b{display:block;font-size:24px}.metric small{color:var(--m);font-size:10px}.row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.sort{border-radius:12px;padding:10px 12px;background:#fff;border:1px solid var(--l);font-size:12px;font-weight:850}.player{width:100%;background:#fff;border:1px solid var(--l);border-radius:18px;padding:13px;display:grid;grid-template-columns:45px 1fr auto;gap:11px;align-items:center;text-align:left}.rank{width:45px;height:45px;border-radius:14px;background:#f2ece9;display:grid;place-items:center;font-weight:900}.player.low .rank{background:#fff1dc;color:#b66a00}.player small{display:block;color:var(--m);margin-top:3px}.count{min-width:58px;border-radius:14px;background:var(--s);color:var(--r);font-size:24px;font-weight:950;text-align:center;padding:8px}.check{display:flex;align-items:center;gap:12px;padding:13px;background:#fff;border:1px solid var(--l);border-radius:16px}.check input{width:21px;height:21px;accent-color:var(--r)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{min-height:76px;border-radius:16px;border:1.5px solid var(--l);background:#fff;padding:9px 5px;display:grid;place-items:center;font-size:12px;font-weight:800}.choice input{display:none}.choice:has(input:checked){background:var(--s);border-color:var(--r)}.choice span{font-size:24px}.chart{background:#fff;border:1px solid var(--l);border-radius:22px;padding:16px;margin-top:14px}.bars{height:190px;display:flex;align-items:flex-end;gap:7px;padding-top:15px}.bar{flex:1;background:linear-gradient(#cc4068,var(--r));border-radius:8px 8px 3px 3px;position:relative}.bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900}.bar small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--m)}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,18px);opacity:0;background:#171517;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:800;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>const P=[['ahmed','Ahmed','AHMED1'],['musa','Musa','MUSA22'],['ibrahim','Ibrahim','IBRA11'],['zain','Zain','ZAIN44'],['rayan','Rayan','RAYAN5'],['hassan','Hassan','HASAN6'],['ali','Ali','ALI777'],['omar','Omar','OMAR88'],['hamza','Hamza','HAMZA9'],['saad','Saad','SAAD10'],['yusuf','Yusuf','YUSF11'],['ayaan','Ayaan','AYAN12'],['rayyan','Rayyan','RAYY13'],['muhammad','Muhammad','MUHD14'],['zayan','Zayan','ZAYN15'],['adam','Adam','ADAM16'],['isa','Isa','ISAA17'],['talha','Talha','TALH18'],['bilal','Bilal','BILA19'],['faris','Faris','FARI20']].map(([id,name,code])=>({id,name,code})),K='lvfc-state',PK='lvfc-parent',CK='lvfc-coach';let R={screen:'role',tab:'live',sort:'low',report:'ahmed'};const bc='BroadcastChannel'in window?new BroadcastChannel('lvfc'):null;function seed(){const sessions=[];for(let w=1;w<=8;w++){const counts={},reflections={};P.forEach((p,i)=>{counts[p.id]=p.id==='ahmed'?[12,16,19,21,25,27,31,35][w-1]:12+((i*3+w*2)%18);if(w>3)reflections[p.id]={engagement:1+((i+w)%3),comfort:1+((i+w+1)%3),tried:(i+w)%2?'yes':'no'}});sessions.push({id:'h'+w,title:'Development Session '+w,date:'Week '+w,status:'ended',active:P.map(x=>x.id),counts,reflections})}return{sessions,current:null}}let S=JSON.parse(localStorage.getItem(K)||'null')||seed();const app=document.querySelector('#app'),toastEl=document.querySelector('#toast');function save(){localStorage.setItem(K,JSON.stringify(S));bc?.postMessage('x');render()}bc?.addEventListener('message',()=>{S=JSON.parse(localStorage.getItem(K)||'null')||seed();render()});addEventListener('storage',e=>{if(e.key===K){S=JSON.parse(e.newValue);render()}});const brand=()=>'<div class="brand"><b>LVFC</b><small>LAHORE VIRGIL<br>FOOTBALL CLUB</small></div>',current=()=>S.sessions.find(s=>s.id===S.current),person=id=>P.find(p=>p.id===id),parent=()=>JSON.parse(localStorage.getItem(PK)||'null');function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1500)}function role(){return`<main class="screen dark"><div class="top">${brand()}<span class="pill">Mobile pilot</span></div><p class="ey">Player Development Tracker</p><h1>One tap.<br>Live insight.<br>Visible progress.</h1><p class="lead">A field-ready mobile workflow for LVFC's 5–6 age group.</p><div class="roles"><button class="role" data-go="parent"><span class="emoji">◎</span><span><strong>Parent view</strong><small>Open your child's counter</small></span><b>›</b></button><button class="role red" data-go="coach"><span class="emoji">▥</span><span><strong>Coach view</strong><small>Run the session from your phone</small></span><b>›</b></button></div><div class="demo" style="background:#ffffff17;color:#f2dde4">This prototype is fully mobile. Firebase will later connect different parents' phones to the coach phone live.</div></main>`}function pLogin(){return`<main class="screen"><div class="top"><button class="back" data-go="role">←</button>${brand()}<span></span></div><p class="ey">Register once</p><h1>Connect to your child.</h1><form class="card" id="pf"><div class="field"><label>Parent name</label><input name="parent" required></div><div class="field"><label>Child access code</label><input name="code" required placeholder="AHMED1"></div><button class="primary">Continue</button></form><div class="demo"><b>Fake-player codes</b><br>AHMED1 · MUSA22 · IBRA11 · ZAIN44</div></main>`}function pView(){const pr=parent();if(!pr)return pLogin();const p=person(pr.playerId),live=current(),pending=[...S.sessions].reverse().find(s=>s.status==='ended'&&s.active.includes(p.id)&&!s.reflections?.[p.id]);if(pending)return reflect(p,pending);if(live&&live.active.includes(p.id))return counter(p,live);return`<main class="screen"><div class="top">${brand()}<button class="back" data-act="plogout">↗</button></div><section class="wait"><div><p class="ey">${p.name} connected</p><h2>Waiting for today's session.</h2><p style="color:var(--m)">The counter appears when the coach starts a session including ${p.name}.</p></div></section></main>`}function counter(p,s){const n=s.counts[p.id]||0;return`<main class="screen counter"><div class="top">${brand()}<button class="back" data-act="plogout">↗</button></div><p class="ey" style="text-align:center">Today's session</p><h1>${p.name}'s touches</h1><p style="text-align:center">Tap every time ${p.name} touches the ball.</p><div class="counterBody"><button class="touch" data-act="touch" data-id="${p.id}"><span class="num">${n}</span><span class="tap">TAP</span></button></div><button class="secondary" style="background:#ffffff18;color:#fff;border-color:#ffffff2b" data-act="undo" data-id="${p.id}">− Undo last touch</button></main>`}function q(n,t,a){return`<div><h3>${t}</h3><div class="choices">${a.map(x=>`<label class="choice"><input type="radio" name="${n}" value="${x[0]}" required><span>${x[1]}</span>${x[2]}</label>`).join('')}</div></div>`}function reflect(p,s){return`<main class="screen"><div class="top">${brand()}<span class="pill" style="background:var(--s);color:var(--r)">15 seconds</span></div><p class="ey">Today's session</p><h2>${p.name}</h2><form id="rf" data-s="${s.id}" data-p="${p.id}">${q('engagement','How engaged did your child seem?',[['1','😐','Low'],['2','🙂','Somewhat'],['3','😄','Highly']])}${q('comfort','How comfortable did they look with the ball?',[['1','🟡','Hesitant'],['2','🟢','Comfortable'],['3','⭐','Confident']])}${q('tried','Did they try something new?',[['yes','✓','Yes'],['no','—','No'],['not-sure','?','Not sure']])}<div class="field" style="margin-top:15px"><label>One word to describe today</label><input name="word" maxlength="24" placeholder="Curious"></div><button class="primary">Submit reflection</button></form></main>`}function cLogin(){return`<main class="screen dark"><div class="top"><button class="back" data-go="role">←</button>${brand()}<span></span></div><p class="ey">Coach access</p><h1>Run the session from your phone.</h1><form class="card" id="cf" style="color:var(--i)"><div class="field"><label>Coach code</label><input name="code" required placeholder="LVFC2026"></div><button class="primary">Open dashboard</button></form><div class="demo" style="background:#ffffff17;color:#f2dde4">Demo coach code: LVFC2026</div></main>`}function coach(){if(localStorage.getItem(CK)!=='yes')return cLogin();return`<main class="coach"><header class="coachHead"><div><small style="color:var(--m)">LVFC Coach</small><b style="display:block">${R.tab==='live'?'Live session':R.tab==='setup'?'Session setup':'Player reports'}</b></div>${brand()}<button class="back" data-act="clogout">↗</button></header><section class="coachContent">${R.tab==='live'?live():R.tab==='setup'?setup():reports()}</section><nav class="nav"><button data-tab="live" class="${R.tab==='live'?'active':''}">●<br>Live</button><button data-tab="setup" class="${R.tab==='setup'?'active':''}">＋<br>Setup</button><button data-tab="reports" class="${R.tab==='reports'?'active':''}">⌁<br>Reports</button></nav></main>`}function live(){const s=current();if(!s)return`<div class="card" style="text-align:center;padding:34px 18px"><h2>No live session</h2><p style="color:var(--m)">Create a session and select active players.</p><button class="primary" data-tab="setup">Create session</button></div>`;let rows=s.active.map(id=>({p:person(id),n:s.counts[id]||0})),avg=Math.round(rows.reduce((a,b)=>a+b.n,0)/rows.length)||0;rows.sort((a,b)=>R.sort==='low'?a.n-b.n:b.n-a.n);return`<div class="banner"><small>LIVE NOW</small><h2>${s.title}</h2><p>${s.date} · ${rows.length} active players</p></div><div class="metrics"><div class="metric"><b>${rows.reduce((a,b)=>a+b.n,0)}</b><small>Total</small></div><div class="metric"><b>${avg}</b><small>Average</small></div><div class="metric"><b>${Math.max(0,...rows.map(x=>x.n))}</b><small>Highest</small></div></div><div class="row"><h3>Active players</h3><button class="sort" data-act="sort">↕ ${R.sort==='low'?'Lowest first':'Highest first'}</button></div><div class="players">${rows.map((x,i)=>`<button class="player ${x.n<Math.max(5,avg*.55)?'low':''}" data-report="${x.p.id}"><span class="rank">${i+1}</span><span><b>${x.p.name}</b><small>${x.n<Math.max(5,avg*.55)?'May need more involvement':'Active in session'}</small></span><span class="count">${x.n}</span></button>`).join('')}</div><div style="height:14px"></div><button class="danger" data-act="end">■ End and save session</button>`}function setup(){if(current())return`<div class="card"><h2>A session is already live.</h2><button class="primary" data-tab="live">View live session</button></div>`;return`<p class="ey">New session</p><h2>Choose who is on the field.</h2><form id="sf"><div class="field"><label>Session title</label><input name="title" value="Saturday U6 Development"></div><div class="checks">${P.map((p,i)=>`<label class="check"><input type="checkbox" name="players" value="${p.id}" ${i<12?'checked':''}><span>${p.name}</span></label>`).join('')}</div><div style="height:12px"></div><button class="primary">▶ Start session</button></form>`}function reports(){const ended=S.sessions.filter(s=>s.status==='ended');return`<p class="ey">Progression</p><h2>Development over time.</h2><div class="players">${P.map(p=>{const vals=ended.filter(s=>s.active.includes(p.id)).map(s=>s.counts[p.id]||0),avg=Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length||1));return`<button class="player" data-report="${p.id}"><span class="rank">${p.name[0]}</span><span><b>${p.name}</b><small>${vals.length} sessions · average ${avg}</small></span><span class="count">${vals.at(-1)||0}</span></button>`}).join('')}</div>`}function report(){const p=person(R.report),sessions=S.sessions.filter(s=>s.status==='ended'&&s.active.includes(p.id)).slice(-8),vals=sessions.map(s=>s.counts[p.id]||0),max=Math.max(1,...vals),avg=Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length||1));return`<main class="screen"><div class="top"><button class="back" data-act="reportBack">←</button>${brand()}<span></span></div><p class="ey">Player report</p><h1>${p.name}</h1><div class="metrics"><div class="metric"><b>${avg}</b><small>Average</small></div><div class="metric"><b>${Math.max(...vals)}</b><small>Highest</small></div><div class="metric"><b>${vals.at(-1)||0}</b><small>Latest</small></div></div><div class="chart"><h3>Ball involvement across sessions</h3><div class="bars">${vals.map((v,i)=>`<div class="bar" style="height:${Math.max(8,v/max*145)}px"><span>${v}</span><small>${i+1}</small></div>`).join('')}</div></div><div class="demo"><b>Meaningful progression</b><br>Touches and parent observations remain separate—never a public child leaderboard.</div></main>`}function render(){app.innerHTML=R.screen==='role'?role():R.screen==='parent'?pView():R.screen==='coach'?coach():report()}render();document.addEventListener('click',e=>{const el=e.target.closest('button,[data-go],[data-tab],[data-report]');if(!el)return;if(el.dataset.go){R.screen=el.dataset.go;render()}if(el.dataset.tab){R.screen='coach';R.tab=el.dataset.tab;render()}if(el.dataset.report){R.screen='report';R.report=el.dataset.report;render()}const a=el.dataset.act;if(a==='plogout'){localStorage.removeItem(PK);R.screen='role';render()}if(a==='clogout'){localStorage.removeItem(CK);R.screen='role';render()}if(a==='touch'||a==='undo'){const s=current(),id=el.dataset.id;if(!s)return;s.counts[id]=Math.max(0,(s.counts[id]||0)+(a==='touch'?1:-1));save()}if(a==='sort'){R.sort=R.sort==='low'?'high':'low';render()}if(a==='end'){const s=current();if(s&&confirm('End and save this session?')){s.status='ended';S.current=null;save();toast('Session saved')}}if(a==='reportBack'){R.screen='coach';R.tab='reports';render()}});document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='pf'){const p=P.find(x=>x.code===String(fd.get('code')).trim().toUpperCase());if(!p)return toast('Code not recognised');localStorage.setItem(PK,JSON.stringify({parent:fd.get('parent'),playerId:p.id}));R.screen='parent';render();toast(p.name+' connected')}if(f.id==='cf'){if(String(fd.get('code')).trim().toUpperCase()!=='LVFC2026')return toast('Incorrect coach code');localStorage.setItem(CK,'yes');R.screen='coach';render()}if(f.id==='sf'){const ids=fd.getAll('players');if(!ids.length)return toast('Select at least one player');const s={id:'s'+Date.now(),title:fd.get('title')||'LVFC Session',date:new Date().toLocaleDateString('en-PK',{day:'numeric',month:'short',year:'numeric'}),status:'live',active:ids,counts:Object.fromEntries(ids.map(id=>[id,0])),reflections:{}};S.sessions.push(s);S.current=s.id;R.tab='live';save();toast('Session is live')}if(f.id==='rf'){const s=S.sessions.find(x=>x.id===f.dataset.s);s.reflections=s.reflections||{};s.reflections[f.dataset.p]={engagement:+fd.get('engagement'),comfort:+fd.get('comfort'),tried:fd.get('tried'),word:fd.get('word')||''};save();toast('Reflection submitted')}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
