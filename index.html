<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#971234">
<link rel="manifest" href="./manifest.webmanifest">
<title>LVFC Player Development Tracker</title>
<style>
:root{--r:#971234;--d:#4a0718;--p:#f7f3ef;--i:#211b1d;--m:#746b6e;--l:#e5dcd8;--s:#f7e5eb;--g:#157347;--a:#b65e00;--blue:#315a9b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--p);color:var(--i)}button,input,select{font:inherit}button{border:0;cursor:pointer}.screen{min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.dark{background:radial-gradient(circle at 70% 0,#bd2d59,#7e0e2e 42%,#2d0610);color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.logo{width:106px;height:auto}.logoBadge{display:inline-flex;background:var(--r);padding:8px 10px;border-radius:12px}.logoBadge .logo{width:94px}.ey{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:var(--r);margin:0 0 8px}.dark .ey,.counter .ey{color:#f4c7d3}h1{font-size:clamp(36px,10vw,54px);line-height:.98;letter-spacing:-.052em;margin:0 0 14px}h2{font-size:28px;line-height:1.05;letter-spacing:-.04em;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}.lead{font-size:16px;line-height:1.5;color:#eedce2}.muted{color:var(--m)}.tiny{font-size:11px}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:17px}.card+.card{margin-top:12px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:850}.field input,.field select{width:100%;border:1.5px solid var(--l);border-radius:15px;padding:14px;background:#fff;color:var(--i)}.primary,.secondary,.danger,.ghost{width:100%;min-height:52px;border-radius:16px;padding:13px 15px;font-weight:900}.primary{background:var(--r);color:#fff}.secondary{background:#fff;border:1px solid var(--l);color:var(--i)}.danger{background:#fff0f3;color:var(--r);border:1px solid #efc5d0}.ghost{background:transparent;border:1px solid #ffffff35;color:#fff}.back,.iconBtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900}.back{background:#ffffff1c;color:#fff}.iconBtn{background:#fff;border:1px solid var(--l);color:var(--i)}.demo{margin-top:14px;background:var(--s);color:var(--d);padding:14px;border-radius:16px;font-size:13px;line-height:1.55}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 11px;background:var(--s);color:var(--r);font-size:11px;font-weight:900}.status.live{background:#e8f6ef;color:var(--g)}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.counter{background:radial-gradient(circle at 50% 0,#bd315d,#8b1032 46%,#430716);color:#fff;display:flex;flex-direction:column}.center{text-align:center}.counterBody{flex:1;display:grid;place-items:center;min-height:410px}.touch{width:min(80vw,340px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#f1e3e8);color:var(--r);box-shadow:0 28px 70px #17000666;display:flex;flex-direction:column;align-items:center;justify-content:center}.touch:active{transform:scale(.965)}.num{font-size:clamp(92px,26vw,130px);font-weight:950;line-height:.82;letter-spacing:-.08em}.tap{margin-top:20px;font-size:14px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;text-align:center;max-width:180px}.counterFoot{display:grid;grid-template-columns:1fr 1fr;gap:10px}.counterFoot .ghost{min-height:50px}.shell{padding-bottom:92px}.shellHead{position:sticky;top:0;z-index:10;margin:-18px -16px 16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#f7f3eff4;backdrop-filter:blur(16px);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:10px}.shellTitle small{display:block;color:var(--m);font-weight:750}.shellTitle strong{font-size:16px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:#fffffff5;border-top:1px solid var(--l);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{background:transparent;padding:8px;font-size:11px;font-weight:850;color:#776f72}.nav button.active{background:var(--s);color:var(--r);border-radius:12px}.hero{background:linear-gradient(140deg,var(--d),var(--r));color:#fff;border-radius:24px;padding:18px}.heroRow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:13px 0}.metrics.three{grid-template-columns:repeat(3,1fr)}.metric{background:#fff;border:1px solid var(--l);border-radius:18px;padding:13px 10px}.metric b{display:block;font-size:24px;letter-spacing:-.04em}.metric small{font-size:10px;color:var(--m);line-height:1.25}.list{display:grid;gap:10px}.player,.sessionRow{background:#fff;border:1px solid var(--l);border-radius:17px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.player small,.sessionRow small{display:block;color:var(--m);margin-top:3px}.count{min-width:58px;font-size:23px;font-weight:950;color:var(--r);background:var(--s);border-radius:13px;padding:8px 11px;text-align:center}.check{display:flex;gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid var(--l);border-radius:14px}.check input{width:21px;height:21px;accent-color:var(--r)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tools button{border-radius:13px;padding:11px;background:#fff;border:1px solid var(--l);font-weight:850}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 0 10px}.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.summaryBox{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px}.summaryBox b{font-size:26px;display:block}.summaryBox span{font-size:11px;color:var(--m)}.factTable{display:grid;gap:8px}.fact{background:#fff;border:1px solid var(--l);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.fact strong{font-size:14px}.fact span{font-size:13px;font-weight:900;color:var(--r)}.alert{background:#fff7e8;border:1px solid #efd39c;color:#7d4d00;border-radius:16px;padding:13px}.empty{padding:28px 18px;text-align:center;background:#fff;border:1px dashed #d5c8c3;border-radius:22px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:var(--s);color:var(--r)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:700px){.screen{max-width:760px;margin:auto}.metrics{grid-template-columns:repeat(4,1fr)}.summaryGrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
const PLAYERS=[['ahmed','Ahmed','AHMED1'],['musa','Musa','MUSA22'],['ibrahim','Ibrahim','IBRA11'],['zain','Zain','ZAIN44'],['rayan','Rayan','RAYAN5'],['hassan','Hassan','HASAN6'],['ali','Ali','ALI777'],['omar','Omar','OMAR88'],['hamza','Hamza','HAMZA9'],['saad','Saad','SAAD10'],['yusuf','Yusuf','YUSF11'],['ayaan','Ayaan','AYAN12'],['rayyan','Rayyan','RAYY13'],['muhammad','Muhammad','MUHD14'],['zayan','Zayan','ZAYN15'],['adam','Adam','ADAM16'],['isa','Isa','ISAA17'],['talha','Talha','TALH18'],['bilal','Bilal','BILA19'],['faris','Faris','FARI20']].map(([id,name,code])=>({id,name,code}));
const KEY='lvfc-tracker-v6',PKEY='lvfc-parent-v6',CKEY='lvfc-coach-v6',MKEY='lvfc-master-v6';
const params=new URLSearchParams(location.search);const ACCESS=['parent','coach','master'].includes(params.get('access'))?params.get('access'):'parent';let tab=ACCESS==='master'?'overview':'live';
const app=document.querySelector('#app');const bc='BroadcastChannel'in window?new BroadcastChannel('lvfc-tracker-v6'):null;
const logoWhite=()=>'<img class="logo" src="./lvfc-logo-white.svg?v=6" alt="LVFC">';
const logoCrimson=()=>'<span class="logoBadge"><img class="logo" src="./lvfc-logo-white.svg?v=6" alt="LVFC"></span>';
const fmtDate=x=>new Date(x).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});const fmtTime=x=>new Date(x).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});const nfmt=x=>Number(x||0).toLocaleString();
function seeded(){let sessions=[];for(let w=1;w<=6;w++){let counts={};PLAYERS.slice(0,12+(w%4)).forEach((p,i)=>counts[p.id]=14+((i*4+w*5)%29));let start=new Date();start.setDate(start.getDate()-(7-w)*7);start.setHours(17,30,0,0);let end=new Date(start.getTime()+60*60000);sessions.push({id:'seed-'+w,title:'U6 Development Week '+w,date:start.toISOString().slice(0,10),ageGroup:'U6',status:'ended',startedAt:start.toISOString(),endedAt:end.toISOString(),activeIds:Object.keys(counts),counts})}return{version:6,liveSessionId:null,sessions}}
function migrate(){let current=JSON.parse(localStorage.getItem(KEY)||'null');if(current)return current;let old=JSON.parse(localStorage.getItem('lvfc-v4')||'null');if(!old)return seeded();let sessions=[];(old.history||[]).forEach((h,i)=>{let start=new Date(Date.now()-(old.history.length-i+1)*7*86400000);sessions.push({id:'migrated-'+i,title:h.name||'Migrated session',date:start.toISOString().slice(0,10),ageGroup:'U6',status:'ended',startedAt:start.toISOString(),endedAt:new Date(start.getTime()+60*60000).toISOString(),activeIds:Object.keys(h.counts||{}),counts:h.counts||{}})});let liveSessionId=null;if(old.live){let id='migrated-live';sessions.push({id,title:old.live.title||'Live session',date:new Date().toISOString().slice(0,10),ageGroup:'U6',status:'live',startedAt:new Date().toISOString(),endedAt:null,activeIds:old.live.active||[],counts:old.live.counts||{}});liveSessionId=id}return{version:6,liveSessionId,sessions:sessions.length?sessions:seeded().sessions}}
let state=migrate();persist(false);
function persist(renderNow=true){localStorage.setItem(KEY,JSON.stringify(state));bc?.postMessage('sync');if(renderNow)render()}
bc?.addEventListener('message',()=>{state=JSON.parse(localStorage.getItem(KEY)||'null')||seeded();render()});addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){state=JSON.parse(e.newValue);render()}});
const player=id=>PLAYERS.find(p=>p.id===id);const live=()=>state.sessions.find(s=>s.id===state.liveSessionId&&s.status==='live');const completed=()=>state.sessions.filter(s=>s.status==='ended').sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt));
function total(s){return Object.values(s?.counts||{}).reduce((a,b)=>a+Number(b||0),0)}function avg(s){return Math.round(total(s)/Math.max(1,s?.activeIds?.length||0))}function duration(s){if(!s.startedAt||!s.endedAt)return 0;return Math.max(1,Math.round((new Date(s.endedAt)-new Date(s.startedAt))/60000))}
function parentLogin(){return`<main class="screen dark"><div class="top">${logoWhite()}<span class="status"><span class="dot"></span>Parent access</span></div><p class="ey">Player Development Tracker</p><h1>Record every ball touch.</h1><p class="lead">Enter your child's private code. This access only opens that child's live counter.</p><form class="card" id="parentLogin" style="color:var(--i)"><div class="field"><label>Parent name</label><input name="parent" required autocomplete="name"></div><div class="field"><label>Child access code</label><input name="code" required placeholder="AHMED1" autocomplete="off"></div><button class="primary">Open parent counter</button></form><div class="demo"><b>Demo codes:</b> AHMED1 · MUSA22 · IBRA11 · ZAIN44</div></main>`}
function parentView(){let pr=JSON.parse(localStorage.getItem(PKEY)||'null');if(!pr)return parentLogin();let p=player(pr.playerId),s=live(),last=completed().find(x=>x.activeIds.includes(p.id));if(!s||!s.activeIds.includes(p.id))return`<main class="screen"><div class="top">${logoCrimson()}<button class="iconBtn" data-action="parentLogout">↗</button></div><span class="status">Parent access</span><div class="empty" style="margin-top:20px"><h2>No live session for ${p.name}</h2><p class="muted">The counter will appear automatically when the coach starts a session and includes ${p.name}.</p>${last?`<div class="card" style="margin-top:16px;text-align:left"><small class="muted">Last saved session</small><h3 style="margin-top:5px">${last.title}</h3><div class="row"><span>${fmtDate(last.endedAt)}</span><strong>${last.counts[p.id]||0} touches</strong></div></div>`:''}</div></main>`;let count=s.counts[p.id]||0;return`<main class="screen counter"><div class="top">${logoWhite()}<button class="back" data-action="parentLogout">↗</button></div><div class="center"><p class="ey">${s.title}</p><h2>${p.name}'s ball touches</h2><p>Tap once every time ${p.name} touches the ball.</p></div><div class="counterBody"><button class="touch" data-action="touch" data-player="${p.id}"><span class="num">${count}</span><span class="tap">Record Ball Touch</span></button></div><div class="counterFoot"><button class="ghost" data-action="undo" data-player="${p.id}">− Undo</button><button class="ghost" disabled>Autosaved ✓</button></div></main>`}
function coachLogin(){return`<main class="screen dark"><div class="top">${logoWhite()}<span class="status"><span class="dot"></span>Coach access</span></div><p class="ey">Session operations</p><h1>Start. Monitor. End. Save.</h1><p class="lead">Coach access only contains session controls and team-level reporting.</p><form class="card" id="coachLogin" style="color:var(--i)"><div class="field"><label>Coach access code</label><input name="code" required placeholder="LVFC2026" autocomplete="off"></div><button class="primary">Open coach dashboard</button></form></main>`}
function shellHead(label,title,logout){return`<header class="shellHead">${logoCrimson()}<div class="shellTitle"><small>${label}</small><strong>${title}</strong></div><button class="iconBtn" data-action="${logout}">↗</button></header>`}
function coachLive(){let s=live();if(!s)return`<div class="empty"><h2>No active session</h2><p class="muted">Create a session, select the attending players, and start it.</p><button class="primary" data-tab="setup">Create session</button></div>`;let rows=s.activeIds.map(id=>({p:player(id),n:s.counts[id]||0})).sort((a,b)=>b.n-a.n);let sessionAvg=avg(s);return`<section class="hero"><div class="heroRow"><div><small>LIVE SESSION</small><h2>${s.title}</h2><p>${fmtDate(s.startedAt)} · Started ${fmtTime(s.startedAt)}</p></div><span class="status live"><span class="dot"></span>Live</span></div></section><div class="metrics three"><div class="metric"><b>${nfmt(total(s))}</b><small>Total touches</small></div><div class="metric"><b>${sessionAvg}</b><small>Average/player</small></div><div class="metric"><b>${s.activeIds.length}</b><small>Active players</small></div></div><div class="sectionHead"><div><p class="ey">Live counts</p><h3>Player totals</h3></div><span class="badge">Autosaving</span></div><div class="list">${rows.map((x,i)=>`<div class="player"><span><b>${i+1}. ${x.p.name}</b><small>${x.n<sessionAvg*.5?'Low-touch flag':'Live count'}</small></span><span class="count">${x.n}</span></div>`).join('')}</div><button class="danger" style="margin-top:16px" data-action="endSession">End & Save Session</button>`}
function coachSetup(){if(live())return`<div class="alert"><b>A live session is already running.</b><p>End and save it before starting another session.</p><button class="primary" data-tab="live">Return to live session</button></div>`;let today=new Date().toISOString().slice(0,10);return`<p class="ey">New session</p><h2>Choose who is active.</h2><form id="sessionForm"><div class="field"><label>Session title</label><input name="title" value="U6 Development Session" required></div><div class="split"><div class="field"><label>Date</label><input name="date" type="date" value="${today}" required></div><div class="field"><label>Age group</label><select name="ageGroup"><option>U5</option><option selected>U6</option><option>U5–U6</option></select></div></div><div class="tools"><button type="button" data-action="selectAll">Select all</button><button type="button" data-action="selectNone">Clear all</button></div><div class="list">${PLAYERS.map((p,i)=>`<label class="check"><input type="checkbox" name="players" value="${p.id}" ${i<12?'checked':''}>${p.name}<span class="tiny muted">${p.code}</span></label>`).join('')}</div><button class="primary" style="margin-top:14px">Start Live Session</button></form>`}
function coachHistory(){let list=completed();return`<p class="ey">Saved records</p><h2>Completed sessions.</h2>${!list.length?'<div class="empty">No completed sessions yet.</div>':`<div class="list">${list.map(s=>`<div class="sessionRow"><span><b>${s.title}</b><small>${fmtDate(s.endedAt)} · ${duration(s)} min · ${s.activeIds.length} players</small></span><span class="count">${total(s)}</span></div>`).join('')}</div>`}`}
function coachView(){if(localStorage.getItem(CKEY)!=='yes')return coachLogin();return`<main class="screen shell">${shellHead('LVFC Coach',tab==='live'?'Live session':tab==='setup'?'Session setup':'Saved sessions','coachLogout')}<section>${tab==='live'?coachLive():tab==='setup'?coachSetup():coachHistory()}</section><nav class="nav"><button data-tab="live" class="${tab==='live'?'active':''}">●<br>Live</button><button data-tab="setup" class="${tab==='setup'?'active':''}">＋<br>Setup</button><button data-tab="history" class="${tab==='history'?'active':''}">▤<br>History</button></nav></main>`}
function masterLogin(){return`<main class="screen dark"><div class="top">${logoWhite()}<span class="status"><span class="dot"></span>Master access</span></div><p class="ey">Director intelligence</p><h1>Hard facts. No noise.</h1><p class="lead">Read-only oversight of sessions, attendance, touches, averages, flags, and player trends.</p><form class="card" id="masterLogin" style="color:var(--i)"><div class="field"><label>Director access code</label><input name="code" required placeholder="LVFCDIRECTOR" autocomplete="off"></div><button class="primary">Open director dashboard</button></form></main>`}
function facts(){let sessions=completed(),participations=sessions.reduce((a,s)=>a+s.activeIds.length,0),touches=sessions.reduce((a,s)=>a+total(s),0),average=Math.round(touches/Math.max(1,participations)),avgPlayers=Math.round(participations/Math.max(1,sessions.length)),best=sessions.reduce((best,s)=>!best||total(s)>total(best)?s:best,null),liveSession=live();return{sessions,participations,touches,average,avgPlayers,best,liveSession}}
function masterOverview(){let f=facts();let flags=[];f.sessions.slice(0,6).forEach(s=>{let a=avg(s);s.activeIds.forEach(id=>{let n=s.counts[id]||0;if(n<a*.5)flags.push({name:player(id).name,session:s.title,n,a})})});return`<section class="hero"><div class="heroRow"><div><small>DIRECTOR VIEW</small><h2>${f.liveSession?'Session currently live':'No live session'}</h2><p>${f.liveSession?`${f.liveSession.title} · ${f.liveSession.activeIds.length} players · ${total(f.liveSession)} touches so far`:'Historical facts are fully available below.'}</p></div>${f.liveSession?'<span class="status live"><span class="dot"></span>Live</span>':''}</div></section><div class="summaryGrid" style="margin-top:12px"><div class="summaryBox"><b>${f.sessions.length}</b><span>Completed sessions</span></div><div class="summaryBox"><b>${nfmt(f.touches)}</b><span>Total recorded touches</span></div><div class="summaryBox"><b>${f.average}</b><span>Avg touches/player-session</span></div><div class="summaryBox"><b>${f.avgPlayers}</b><span>Avg active players/session</span></div></div><div class="sectionHead"><div><p class="ey">Hard facts</p><h3>Operational summary</h3></div><button class="iconBtn" data-action="exportCsv">⇩</button></div><div class="factTable"><div class="fact"><strong>Player participations</strong><span>${f.participations}</span></div><div class="fact"><strong>Highest-volume session</strong><span>${f.best?`${total(f.best)} touches`:'—'}</span></div><div class="fact"><strong>Sessions in last 30 days</strong><span>${f.sessions.filter(s=>Date.now()-new Date(s.endedAt)<30*86400000).length}</span></div><div class="fact"><strong>Players tracked at least once</strong><span>${new Set(f.sessions.flatMap(s=>s.activeIds)).size}/${PLAYERS.length}</span></div></div><div class="sectionHead"><div><p class="ey">Exceptions</p><h3>Low-touch flags</h3></div><span class="badge">Below 50% of session avg</span></div>${flags.length?`<div class="list">${flags.slice(0,8).map(x=>`<div class="player"><span><b>${x.name}</b><small>${x.session} · session avg ${x.a}</small></span><span class="count">${x.n}</span></div>`).join('')}</div>`:'<div class="empty">No low-touch flags.</div>'}`}
function masterSessions(){let list=completed();return`<p class="ey">Session facts</p><h2>Every completed session.</h2><div class="list">${list.map(s=>`<div class="sessionRow"><span><b>${s.title}</b><small>${fmtDate(s.endedAt)} · ${duration(s)} min · ${s.activeIds.length} players · avg ${avg(s)}</small></span><span class="count">${total(s)}</span></div>`).join('')}</div>`}
function playerFacts(p,sessions){let attended=sessions.filter(s=>s.activeIds.includes(p.id)),vals=attended.map(s=>s.counts[p.id]||0),touches=vals.reduce((a,b)=>a+b,0),average=Math.round(touches/Math.max(1,vals.length)),recent=vals.slice(0,3),older=vals.slice(3,6),trend=Math.round((recent.reduce((a,b)=>a+b,0)/Math.max(1,recent.length))-(older.reduce((a,b)=>a+b,0)/Math.max(1,older.length)));return{attended:attended.length,touches,average,trend}}
function masterPlayers(){let sessions=completed();let rows=PLAYERS.map(p=>({p,...playerFacts(p,sessions)})).sort((a,b)=>b.average-a.average);return`<p class="ey">Player facts</p><h2>Attendance and touch trends.</h2><div class="list">${rows.map(x=>`<div class="player"><span><b>${x.p.name}</b><small>${x.attended} sessions · ${x.touches} total · trend ${x.trend>0?'+':''}${x.trend}</small></span><span class="count">${x.average}</span></div>`).join('')}</div>`}
function masterView(){if(localStorage.getItem(MKEY)!=='yes')return masterLogin();return`<main class="screen shell">${shellHead('LVFC Directors',tab==='overview'?'Hard facts':tab==='sessions'?'Session facts':'Player facts','masterLogout')}<section>${tab==='overview'?masterOverview():tab==='sessions'?masterSessions():masterPlayers()}</section><nav class="nav"><button data-tab="overview" class="${tab==='overview'?'active':''}">▦<br>Overview</button><button data-tab="sessions" class="${tab==='sessions'?'active':''}">▤<br>Sessions</button><button data-tab="players" class="${tab==='players'?'active':''}">◎<br>Players</button></nav></main>`}
function render(){app.innerHTML=ACCESS==='parent'?parentView():ACCESS==='coach'?coachView():masterView()}
function endSession(){let s=live();if(!s)return;if(!confirm(`End and permanently save “${s.title}”?`))return;s.status='ended';s.endedAt=new Date().toISOString();state.liveSessionId=null;persist();alert('Session ended and saved to history.');tab='history';render()}
function exportCsv(){let rows=[['Session','Date','Duration Minutes','Active Players','Total Touches','Average Touches']];completed().forEach(s=>rows.push([s.title,fmtDate(s.endedAt),duration(s),s.activeIds.length,total(s),avg(s)]));let csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lvfc-session-facts.csv';a.click();URL.revokeObjectURL(url)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let action=b.dataset.action;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(action==='touch'||action==='undo'){let s=live(),id=b.dataset.player;if(!s||!s.activeIds.includes(id))return;s.counts[id]=Math.max(0,(s.counts[id]||0)+(action==='touch'?1:-1));persist();return}if(action==='parentLogout'){localStorage.removeItem(PKEY);render()}if(action==='coachLogout'){localStorage.removeItem(CKEY);render()}if(action==='masterLogout'){localStorage.removeItem(MKEY);render()}if(action==='endSession')endSession();if(action==='selectAll')document.querySelectorAll('input[name="players"]').forEach(x=>x.checked=true);if(action==='selectNone')document.querySelectorAll('input[name="players"]').forEach(x=>x.checked=false);if(action==='exportCsv')exportCsv()});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='parentLogin'){let p=PLAYERS.find(x=>x.code===String(d.get('code')).trim().toUpperCase());if(!p)return alert('Child code not recognised.');localStorage.setItem(PKEY,JSON.stringify({playerId:p.id,parentName:d.get('parent')}));render()}if(f.id==='coachLogin'){if(String(d.get('code')).trim().toUpperCase()!=='LVFC2026')return alert('Incorrect coach code.');localStorage.setItem(CKEY,'yes');render()}if(f.id==='masterLogin'){if(String(d.get('code')).trim().toUpperCase()!=='LVFCDIRECTOR')return alert('Incorrect director code.');localStorage.setItem(MKEY,'yes');render()}if(f.id==='sessionForm'){if(live())return alert('End the current session first.');let ids=d.getAll('players');if(!ids.length)return alert('Select at least one active player.');let id='session-'+Date.now();let counts=Object.fromEntries(ids.map(x=>[x,0]));state.sessions.push({id,title:String(d.get('title')).trim(),date:d.get('date'),ageGroup:d.get('ageGroup'),status:'live',startedAt:new Date().toISOString(),endedAt:null,activeIds:ids,counts});state.liveSessionId=id;tab='live';persist()}});
render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6'));
</script>
</body>
</html>
