<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f1032"><link rel="manifest" href="./manifest.webmanifest"><title>LVFC Player Tracker</title><style>
:root{--r:#971234;--d:#4a0718;--p:#f7f3ef;--i:#211b1d;--m:#746b6e;--l:#e5dcd8;--s:#f7e5eb}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0}.screen{min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 17px calc(24px + env(safe-area-inset-bottom))}.dark{background:radial-gradient(circle at 70% 0,#bd2d59,#7e0e2e 42%,#2d0610);color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.logo{width:105px;height:auto}.ey{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#f4c7d3;margin:0 0 9px}h1{font-size:clamp(38px,11vw,58px);line-height:.96;letter-spacing:-.055em;margin:0 0 15px}h2{font-size:29px;letter-spacing:-.04em;margin:0 0 10px}.lead{font-size:17px;line-height:1.5;color:#eedce2}.roles,.list{display:grid;gap:12px}.role{padding:18px;border-radius:22px;background:#fff;color:var(--i);display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:12px;text-align:left}.role.red{background:#c62a56;color:#fff}.ico{width:52px;height:52px;border-radius:17px;background:var(--s);display:grid;place-items:center;font-size:25px}.role.red .ico{background:#ffffff22}.role strong{display:block;font-size:18px}.role small{display:block;margin-top:4px;color:var(--m)}.role.red small{color:#f9e2e9}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:18px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:850}.field input{border:1.5px solid var(--l);border-radius:15px;padding:15px}.primary,.secondary{width:100%;min-height:54px;border-radius:16px;font-weight:900;padding:14px}.primary{background:var(--r);color:#fff}.secondary{background:#ffffff1b;color:#fff}.back{width:44px;height:44px;border-radius:14px;background:#ffffff1c;color:#fff;font-weight:900}.demo{margin-top:14px;background:var(--s);color:var(--d);padding:14px;border-radius:16px;font-size:13px;line-height:1.55}.counter{background:radial-gradient(circle at 50% 0,#bd315d,#8b1032 46%,#430716);color:#fff;display:flex;flex-direction:column}.center{text-align:center}.counterBody{flex:1;display:grid;place-items:center;min-height:420px}.touch{width:min(80vw,340px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#f1e3e8);color:var(--r);box-shadow:0 28px 70px #17000666;display:flex;flex-direction:column;align-items:center;justify-content:center}.touch:active{transform:scale(.965)}.num{font-size:clamp(92px,26vw,130px);font-weight:950;line-height:.82;letter-spacing:-.08em}.tap{margin-top:20px;font-size:14px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;text-align:center;max-width:170px}.live{font-size:12px;text-align:center;color:#f3dce3;margin-top:10px}.coach{padding-bottom:90px}.bar{background:linear-gradient(140deg,var(--d),var(--r));color:#fff;border-radius:24px;padding:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#fff;border:1px solid var(--l);border-radius:18px;padding:12px 9px}.metric b{display:block;font-size:24px}.metric small{font-size:10px;color:var(--m)}.player{background:#fff;border:1px solid var(--l);border-radius:17px;padding:13px;display:grid;grid-template-columns:1fr auto;align-items:center}.count{font-size:24px;font-weight:950;color:var(--r);background:var(--s);border-radius:13px;padding:8px 12px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fffffff4;border-top:1px solid var(--l);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{background:transparent;padding:8px;font-size:11px;font-weight:850;color:#776f72}.nav .active{background:var(--s);color:var(--r);border-radius:12px}.check{display:flex;gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid var(--l);border-radius:14px}.check input{width:21px;height:21px;accent-color:var(--r)}
</style></head><body><div id="app"></div><script>
const players=[['ahmed','Ahmed','AHMED1'],['musa','Musa','MUSA22'],['ibrahim','Ibrahim','IBRA11'],['zain','Zain','ZAIN44'],['rayan','Rayan','RAYAN5'],['hassan','Hassan','HASAN6'],['ali','Ali','ALI777'],['omar','Omar','OMAR88'],['hamza','Hamza','HAMZA9'],['saad','Saad','SAAD10'],['yusuf','Yusuf','YUSF11'],['ayaan','Ayaan','AYAN12'],['rayyan','Rayyan','RAYY13'],['muhammad','Muhammad','MUHD14'],['zayan','Zayan','ZAYN15'],['adam','Adam','ADAM16'],['isa','Isa','ISAA17'],['talha','Talha','TALH18'],['bilal','Bilal','BILA19'],['faris','Faris','FARI20']].map(([id,name,code])=>({id,name,code}));
const KEY='lvfc-v4',PKEY='lvfc-parent-v4',CKEY='lvfc-coach-v4';let route='home',tab='live';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{live:null,history:[{name:'Week 1',counts:Object.fromEntries(players.map((p,i)=>[p.id,12+i%8]))}]};
const logo=()=>'<img class="logo" src="./lvfc-logo-white.svg?v=4" alt="Official LVFC logo">';const app=document.querySelector('#app');const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const profile=()=>JSON.parse(localStorage.getItem(PKEY)||'null');
function home(){return`<main class="screen dark"><div class="top">${logo()}<span style="font-size:12px;font-weight:850">Mobile Pilot</span></div><p class="ey">Player Development Tracker</p><h1>One tap.<br>Live insight.<br>Visible progress.</h1><p class="lead">A field-ready mobile workflow for LVFC's 5–6 age group.</p><div class="roles"><button class="role" data-go="parent"><span class="ico">◎</span><span><strong>Parent view</strong><small>Record every ball touch</small></span><b>›</b></button><button class="role red" data-go="coach"><span class="ico">▥</span><span><strong>Coach view</strong><small>See live touch totals</small></span><b>›</b></button></div></main>`}
function parent(){let pr=profile();if(!pr)return`<main class="screen"><div class="top"><button data-go="home">←</button><span></span></div><img src="./lvfc-logo-white.svg?v=4" style="width:120px;background:var(--r);padding:12px;border-radius:16px"><p style="color:var(--r);font-weight:900;letter-spacing:.12em;text-transform:uppercase">Register once</p><h1>Connect to your child.</h1><form class="card" id="parentForm"><div class="field"><label>Parent name</label><input name="parent" required></div><div class="field"><label>Child code</label><input name="code" required placeholder="AHMED1"></div><button class="primary">Open touch counter</button></form><div class="demo"><b>Demo codes:</b> AHMED1 · MUSA22 · IBRA11 · ZAIN44</div></main>`;let p=players.find(x=>x.id===pr.id);if(!state.live||!state.live.active.includes(p.id)){state.live=state.live||{title:'Demo Touch Session',active:[],counts:{}};if(!state.live.active.includes(p.id))state.live.active.push(p.id);state.live.counts[p.id]=state.live.counts[p.id]||0;localStorage.setItem(KEY,JSON.stringify(state))}let n=state.live.counts[p.id]||0;return`<main class="screen counter"><div class="top">${logo()}<button class="back" data-act="logoutParent">↗</button></div><div class="center"><p class="ey">Live session</p><h2>${p.name}'s ball touches</h2><p>Tap the button every time ${p.name} touches the ball.</p></div><div class="counterBody"><button class="touch" data-act="touch" data-id="${p.id}"><span class="num">${n}</span><span class="tap">Record Ball Touch</span></button></div><button class="secondary" data-act="undo" data-id="${p.id}">− Undo last touch</button><div class="live">● Counter active</div></main>`}
function coach(){if(localStorage.getItem(CKEY)!=='yes')return`<main class="screen dark"><div class="top"><button class="back" data-go="home">←</button>${logo()}<span></span></div><p class="ey">Coach access</p><h1>Run the session from your phone.</h1><form class="card" id="coachForm" style="color:var(--i)"><div class="field"><label>Coach code</label><input name="code" required placeholder="LVFC2026"></div><button class="primary">Open dashboard</button></form></main>`;return`<main class="screen coach"><div class="top"><div><small>LVFC Coach</small><strong style="display:block">${tab==='live'?'Live session':tab==='setup'?'Session setup':'Reports'}</strong></div><img src="./lvfc-logo-white.svg?v=4" style="width:82px;background:var(--r);padding:8px;border-radius:12px"><button data-act="logoutCoach">↗</button></div>${tab==='live'?liveView():tab==='setup'?setupView():reportsView()}<nav class="nav"><button data-tab="live" class="${tab==='live'?'active':''}">●<br>Live</button><button data-tab="setup" class="${tab==='setup'?'active':''}">＋<br>Setup</button><button data-tab="reports" class="${tab==='reports'?'active':''}">⌁<br>Reports</button></nav></main>`}
function liveView(){let s=state.live;if(!s)return`<div class="card"><h2>No live session</h2><p>Create one from Setup.</p><button class="primary" data-tab="setup">Create session</button></div>`;let rows=s.active.map(id=>({p:players.find(x=>x.id===id),n:s.counts[id]||0}));let total=rows.reduce((a,b)=>a+b.n,0),avg=Math.round(total/(rows.length||1)),max=Math.max(0,...rows.map(x=>x.n));return`<section class="bar"><small>LIVE NOW</small><h2>${s.title}</h2><p>${rows.length} active players</p></section><div class="metrics"><div class="metric"><b>${total}</b><small>Total</small></div><div class="metric"><b>${avg}</b><small>Average</small></div><div class="metric"><b>${max}</b><small>Highest</small></div></div><div class="list">${rows.map(x=>`<div class="player"><span><b>${x.p.name}</b><small style="display:block;color:var(--m)">Live touch count</small></span><span class="count">${x.n}</span></div>`).join('')}</div>`}
function setupView(){return`<h2>Choose active players.</h2><form id="sessionForm"><div class="field"><label>Session name</label><input name="title" value="Saturday U6 Development"></div><div class="list">${players.map((p,i)=>`<label class="check"><input type="checkbox" name="ids" value="${p.id}" ${i<12?'checked':''}>${p.name}</label>`).join('')}</div><button class="primary" style="margin-top:14px">Start live session</button></form>`}
function reportsView(){return`<h2>Player progression.</h2><div class="list">${players.map(p=>{let vals=state.history.map(h=>h.counts[p.id]||0),latest=vals.at(-1)||0;return`<div class="player"><span><b>${p.name}</b><small style="display:block;color:var(--m)">${vals.length} saved session</small></span><span class="count">${latest}</span></div>`}).join('')}</div>`}
function render(){app.innerHTML=route==='home'?home():route==='parent'?parent():coach()}render();
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){route=b.dataset.go;render()}if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.act==='touch'||b.dataset.act==='undo'){let id=b.dataset.id;state.live.counts[id]=Math.max(0,(state.live.counts[id]||0)+(b.dataset.act==='touch'?1:-1));save()}if(b.dataset.act==='logoutParent'){localStorage.removeItem(PKEY);route='home';render()}if(b.dataset.act==='logoutCoach'){localStorage.removeItem(CKEY);route='home';render()}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='parentForm'){let p=players.find(x=>x.code===String(d.get('code')).trim().toUpperCase());if(!p)return alert('Code not recognised');localStorage.setItem(PKEY,JSON.stringify({id:p.id,parent:d.get('parent')}));route='parent';render()}if(f.id==='coachForm'){if(String(d.get('code')).trim().toUpperCase()!=='LVFC2026')return alert('Incorrect code');localStorage.setItem(CKEY,'yes');route='coach';render()}if(f.id==='sessionForm'){let ids=d.getAll('ids');if(!ids.length)return alert('Select at least one player');state.live={title:d.get('title')||'LVFC Session',active:ids,counts:Object.fromEntries(ids.map(id=>[id,0]))};save();tab='live';render()}});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=4'));
</script></body></html>
