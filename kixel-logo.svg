<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">KIXEL</title>
  <desc id="desc">Official neon lime, cyan and white KIXEL technology logo on black.</desc>
  <defs>
    <filter id="limeGlow" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feFlood flood-color="#c6ff1a" flood-opacity=".75"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feFlood flood-color="#16e7ef" flood-opacity=".75"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="whiteGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity=".55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lowerK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f6ec"/><stop offset=".55" stop-color="#45cfff"/><stop offset="1" stop-color="#10e6e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#000"/>

  <g transform="translate(38 64)">
